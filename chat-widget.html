<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget - Localhost Test</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 10px;
        }
        
        p {
            color: rgba(255,255,255,0.85);
            margin-bottom: 40px;
        }
        
        .info {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <h1>Chat Widget Running Locally</h1>
    <p>Click the chat button in the bottom right corner →</p>
    
    <div class="info">
        <strong>✅ Working Features:</strong><br>
        • Fully isolated with Shadow DOM<br>
        • Beautiful animations<br>
        • Auto-growing input<br>
        • Conversation saved in localStorage<br>
        • Responsive design<br>
        • Enter to send
    </div>

    <script>
        class ChatWidget {
            constructor() {
                this.config = {
                    primaryColor: "#10b981",
                    companyName: "Local Test Bot",
                    avatar: "https://i.pravatar.cc/128?u=bot",
                    welcomeMessage: "Hello! I'm running locally. Try sending a message! 👋",
                    placeholder: "Type a message..."
                };
                this.isOpen = false;
                this.conversation = [];
                this.visitorId = 'local_' + Date.now();
                this.init();
            }

            init() {
                this.createWidget();
                this.loadConversation();
            }

            createWidget() {
                const container = document.createElement('div');
                container.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    z-index: 999999;
                    font-family: system-ui, sans-serif;
                `;

                this.shadow = container.attachShadow({ mode: 'open' });

                this.shadow.innerHTML = `
                    <style>
                        :host {
                            --primary: ${this.config.primaryColor};
                        }
                        
                        .cw-button {
                            width: 65px;
                            height: 65px;
                            background: var(--primary);
                            color: white;
                            border-radius: 50%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            box-shadow: 0 10px 30px -8px var(--primary);
                            cursor: pointer;
                            transition: all 0.3s ease;
                            border: none;
                        }
                        
                        .cw-button:hover {
                            transform: scale(1.1);
                        }
                        
                        .cw-window {
                            position: absolute;
                            bottom: 85px;
                            right: 0;
                            width: 380px;
                            height: 560px;
                            background: white;
                            border-radius: 20px;
                            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
                            display: none;
                            flex-direction: column;
                            overflow: hidden;
                            transform: scale(0.9);
                            opacity: 0;
                            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                        }
                        
                        .cw-window.open {
                            display: flex;
                            transform: scale(1);
                            opacity: 1;
                        }
                        
                        .cw-header {
                            background: var(--primary);
                            color: white;
                            padding: 16px 20px;
                            display: flex;
                            align-items: center;
                            gap: 12px;
                        }
                        
                        .cw-avatar {
                            width: 42px;
                            height: 42px;
                            border-radius: 50%;
                            background: white;
                            padding: 3px;
                        }
                        
                        .cw-messages {
                            flex: 1;
                            overflow-y: auto;
                            padding: 20px;
                            background: #f8fafc;
                            display: flex;
                            flex-direction: column;
                            gap: 12px;
                        }
                        
                        .cw-message {
                            max-width: 75%;
                            padding: 13px 17px;
                            border-radius: 18px;
                            animation: fadeIn 0.3s;
                        }
                        
                        .cw-message.bot {
                            align-self: flex-start;
                            background: white;
                            border-bottom-left-radius: 6px;
                        }
                        
                        .cw-message.user {
                            align-self: flex-end;
                            background: var(--primary);
                            color: white;
                            border-bottom-right-radius: 6px;
                        }
                        
                        .cw-input-area {
                            padding: 16px;
                            background: white;
                            border-top: 1px solid #e2e8f0;
                        }
                        
                        .cw-input-wrapper {
                            display: flex;
                            background: #f1f5f9;
                            border-radius: 9999px;
                            padding: 8px;
                        }
                        
                        .cw-textarea {
                            flex: 1;
                            border: none;
                            background: transparent;
                            outline: none;
                            max-height: 120px;
                            padding: 10px 12px;
                            font-size: 15px;
                            resize: none;
                        }
                        
                        .cw-send-btn {
                            width: 42px;
                            height: 42px;
                            background: var(--primary);
                            color: white;
                            border: none;
                            border-radius: 50%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            cursor: pointer;
                        }
                        
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(15px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                    </style>

                    <div>
                        <!-- Floating Button -->
                        <button class="cw-button" id="toggle">
                            💬
                        </button>

                        <!-- Chat Window -->
                        <div class="cw-window" id="window">
                            <div class="cw-header">
                                <img src="${this.config.avatar}" class="cw-avatar">
                                <div>
                                    <strong>${this.config.companyName}</strong><br>
                                    <small>● Online now</small>
                                </div>
                                <button id="close" style="margin-left:auto; background:none; border:none; color:white; font-size:28px; cursor:pointer;">×</button>
                            </div>
                            
                            <div class="cw-messages" id="messages"></div>
                            
                            <div class="cw-input-area">
                                <div class="cw-input-wrapper">
                                    <textarea id="input" class="cw-textarea" placeholder="${this.config.placeholder}" rows="1"></textarea>
                                    <button class="cw-send-btn" id="send">↑</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.body.appendChild(container);
                this.bindEvents();
            }

            bindEvents() {
                const toggle = this.shadow.getElementById('toggle');
                const close = this.shadow.getElementById('close');
                const send = this.shadow.getElementById('send');
                const input = this.shadow.getElementById('input');
                const windowEl = this.shadow.getElementById('window');

                toggle.addEventListener('click', () => this.toggle());
                close.addEventListener('click', () => this.close());
                
                send.addEventListener('click', () => this.sendMessage());
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
            }

            toggle() {
                const win = this.shadow.getElementById('window');
                this.isOpen = !this.isOpen;
                win.classList.toggle('open', this.isOpen);
                
                if (this.isOpen && this.conversation.length === 0) {
                    setTimeout(() => {
                        this.addBotMessage(this.config.welcomeMessage);
                    }, 400);
                }
            }

            open() { if (!this.isOpen) this.toggle(); }
            close() { if (this.isOpen) this.toggle(); }

            addMessage(text, type) {
                const container = this.shadow.getElementById('messages');
                const msg = document.createElement('div');
                msg.className = `cw-message ${type}`;
                msg.textContent = text;
                container.appendChild(msg);
                container.scrollTop = container.scrollHeight;
            }

            addBotMessage(text) {
                this.addMessage(text, 'bot');
                this.conversation.push({type: 'bot', text});
                this.saveConversation();
            }

            addUserMessage(text) {
                this.addMessage(text, 'user');
                this.conversation.push({type: 'user', text});
                this.saveConversation();
            }

            sendMessage() {
                const input = this.shadow.getElementById('input');
                const text = input.value.trim();
                
                if (!text) return;
                
                this.addUserMessage(text);
                input.value = '';
                
                // Simulate reply
                setTimeout(() => {
                    const replies = [
                        "Thanks for your message! 😊",
                        "Interesting! Tell me more.",
                        "Got it! How else can I help?",
                        "This is a local demo. It works great!"
                    ];
                    this.addBotMessage(replies[Math.floor(Math.random() * replies.length)]);
                }, 800);
            }

            saveConversation() {
                localStorage.setItem('local_chatwidget_conv', JSON.stringify(this.conversation));
            }

            loadConversation() {
                const saved = localStorage.getItem('local_chatwidget_conv');
                if (saved) this.conversation = JSON.parse(saved);
            }
        }

        // Auto start
        window.onload = () => {
            new ChatWidget();
        };
    </script>
</body>
</html>
